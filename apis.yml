name: Ranger
description: >-
  Ranger is an AI-powered quality-assurance platform that lets coding agents verify
  their own work in a real browser. Its CLI (@ranger-testing/ranger-cli) sets up a
  project so an AI coding agent — Claude Code, OpenCode, Cursor, Codex, or any bash-capable
  agent — can run autonomous end-to-end feature reviews: creating scenarios, driving
  Chromium, self-maintaining broken tests, auto-scaling parallel browsers, and collecting
  screenshots, recordings, and traces as evidence, with results reviewed on a shared
  dashboard. Ranger is agent-native rather than a conventional REST API: it ships a
  Claude Code plugin (ranger@trailhead), Agent Skills installed to .claude/skills/, slash
  commands, hooks, and OAuth 2.0 / OpenID Connect authentication (login.ranger.net), with
  MCP-based auth delegation for managed agent platforms. Backed by General Catalyst and
  Homebrew.
